name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One package, one job. The three entry points (the registry, the
        # filesystem adapter, and the subprocess adapter) ship together, so
        # there is no dependency ordering to respect between them.
        package: [packages/node]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The lockfile is committed, so installs are reproducible. The suites
      # themselves need no test framework: Node's built-in runner strips the
      # TypeScript types, so the runtime dependencies are only `ws` and the
      # dsh packages they build against.
      - name: Install
        # `node-pty` is an OPTIONAL dependency, so an install without a
        # prebuilt binary for this platform still succeeds; the agent reports
        # `tty.*` as unimplemented on such a machine, and the terminal tests
        # skip rather than fail. That is the behaviour a real deployment gets,
        # so CI exercises it rather than forcing a native build.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built CLI runs
        run: node lib/agent-cli.js --describe

      # The subpath entries are the package's public surface: an adapter that
      # stops resolving would break every deployment while the root import kept
      # working, so each one is imported by name rather than assumed.
      - name: Verify every entry point resolves
        run: |
          node -e "
          Promise.all([
            import('@shaowenchen/deepseek-harness-remote-node'),
            import('@shaowenchen/deepseek-harness-remote-node/fs'),
            import('@shaowenchen/deepseek-harness-remote-node/subprocess'),
          ]).then(([root, fs, sub]) => {
            for (const [name, mod] of [['.', root], ['./fs', fs], ['./subprocess', sub]]) {
              if (typeof mod.default !== 'function') {
                console.error(name + ' did not export a plugin class')
                process.exit(1)
              }
              console.log(name + ' -> ' + mod.default.name)
            }
          })
          "

  # The installers build with `npm ci --include=dev`, and whether that flag is
  # needed depends on NODE_ENV — which CI does not otherwise set. A build that
  # works here and fails in a production container is the exact bug this job
  # exists to catch, so it installs the way a deployment container does.
  install-under-production-env:
    name: install (NODE_ENV=production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Mirrors what scripts/install-{host,node}.sh do, on a host configured
      # like a deployment container.
      - name: Install and build as a production host would
        env:
          NODE_ENV: production
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - name: Verify the build produced every entry point
        run: |
          for f in lib/index.js lib/fs-node.js lib/subprocess-node.js lib/agent-cli.js; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
