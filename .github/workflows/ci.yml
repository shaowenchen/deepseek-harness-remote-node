name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both adapters depend on the agent package via `file:../node`, so they
        # are verified after it rather than in parallel — see the "Build the
        # agent package first" step.
        package: [packages/node, packages/fs-node, packages/subprocess-node]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The lockfile is committed, so installs are reproducible. The suites
      # themselves need no test framework: Node's built-in runner strips the
      # TypeScript types, so the runtime dependencies are only `ws` and the
      # dsh packages they build against.
      #
      # The adapters resolve `@shaowenchen/dsh-node` through a `file:../node`
      # dependency, which links the source directory — so the agent package must
      # be BUILT before the adapter's tests can import it.
      - name: Build the agent package first
        if: matrix.package != 'packages/node'
        working-directory: packages/node
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install
        # `node-pty` is an OPTIONAL dependency of the agent, so an install
        # without a prebuilt binary for this platform still succeeds; the
        # agent reports `tty.*` as unimplemented on such a machine, and the
        # terminal tests skip rather than fail. That is the behaviour a real
        # deployment gets, so CI exercises it rather than forcing a build.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built CLI runs
        if: matrix.package == 'packages/node'
        run: node lib/agent-cli.js --describe
